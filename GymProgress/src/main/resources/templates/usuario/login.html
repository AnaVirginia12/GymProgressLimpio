<!DOCTYPE html>
<html lang="es"
      data-bs-theme="dark"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head('Iniciar sesión')}"></head>
    <body>
        <div class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
            <div class="row justify-content-center w-100">
                <div class="col-12 col-sm-10 col-md-7 col-lg-5">
                    <div class="card">
                        <div class="card-body p-4 p-md-5">
                            <div th:replace="~{general/fragmentos :: marca}"></div>
                            <h1 class="h3 mb-4">Iniciar sesión</h1>
                            <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
                            <div th:if="${mensaje}" class="alert alert-success" role="alert" th:text="${mensaje}"></div>
                            <form method="post" th:action="@{/login}">
                                <div class="mb-3">
                                    <label class="form-label" for="correo">Correo electrónico</label>
                                    <input id="correo"
                                           type="email"
                                           class="form-control"
                                           name="correo"
                                           required
                                           autocomplete="email"
                                           placeholder="tu@correo.com">
                                </div>
                                <div class="mb-4">
                                    <label class="form-label" for="password">Contraseña</label>
                                    <input id="password"
                                           type="password"
                                           class="form-control"
                                           name="password"
                                           required
                                           autocomplete="current-password"
                                           placeholder="••••••••">
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">
                                        Entrar
                                    </button>
                                </div>
                            </form>
                            <p class="text-center text-body-secondary small mt-4 mb-0">
                                ¿No tienes cuenta?
                                <a th:href="@{/registro}">Crear cuenta</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    <th:block th:replace="~{general/fragmentos :: scripts}"></th:block>
</body>
</html>
