<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head('Iniciar sesión')}"></head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-brand">
            <span class="sidebar__logo">GP</span>
            <strong>GymProgress</strong>
        </div>

        <h1 class="auth-title">Iniciar sesión</h1>

        <!-- HU1 — Mensajes de feedback -->
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert-success" th:text="${mensaje}"></div>

        <!-- HU1 — Formulario de login -->
        <form method="post" th:action="@{/login}" class="auth-form">

            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input id="correo"
                       type="email"
                       name="correo"
                       required
                       autocomplete="email"
                       placeholder="tu@correo.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password"
                       type="password"
                       name="password"
                       required
                       autocomplete="current-password"
                       placeholder="••••••••">
            </div>

            <button type="submit" class="button-primary auth-submit">
                Entrar
            </button>

        </form>

        <p class="auth-footer">
            ¿No tienes cuenta?
            <a th:href="@{/registro}">Crear cuenta</a>
        </p>

    </div>

</div>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
