<!DOCTYPE html>
<html lang="es"
      data-bs-theme="dark"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head('Crear cuenta')}"></head>
    <body>
        <div class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
            <div class="row justify-content-center w-100">
                <div class="col-12 col-md-10 col-lg-8">
                    <div class="card">
                        <div class="card-body p-4 p-md-5">
                            <div th:replace="~{general/fragmentos :: marca}"></div>
                            <h1 class="h3 mb-1">Crear cuenta</h1>
                            <p class="text-body-secondary">
                                Cuéntanos un poco para personalizar tu experiencia.
                            </p>
                            <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
                            <div th:if="${mensaje}" class="alert alert-success" role="alert" th:text="${mensaje}"></div>
                            <form method="post" th:action="@{/registro}" th:object="${usuario}">
                                <fieldset class="border rounded-3 p-4 mb-4">
                                    <legend class="float-none w-auto px-2 fs-6 fw-bold text-uppercase text-body-secondary">
                                        Datos de cuenta
                                    </legend>
                                    <div class="mb-3">
                                        <label class="form-label" for="nombre">Nombre completo</label>
                                        <input id="nombre" type="text" class="form-control" th:field="*{nombre}"
                                               required placeholder="Tu nombre">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label" for="correo">Correo electrónico</label>
                                        <input id="correo" type="email" class="form-control" th:field="*{correo}"
                                               required placeholder="tu@correo.com" autocomplete="email">
                                    </div>
                                    <div>
                                        <label class="form-label" for="password">Contraseña</label>
                                        <input id="password" type="password" class="form-control" th:field="*{password}"
                                               required placeholder="Mínimo 8 caracteres" autocomplete="new-password">
                                    </div>
                                </fieldset>
                                <fieldset class="border rounded-3 p-4 mb-4">
                                    <legend class="float-none w-auto px-2 fs-6 fw-bold text-uppercase text-body-secondary">
                                        Tu perfil de entrenamiento
                                    </legend>
                                    <div class="row g-3 mb-3">
                                        <div class="col-12 col-md-6">
                                            <label class="form-label" for="objetivo">Objetivo principal</label>
                                            <select id="objetivo" class="form-select" th:field="*{objetivo}">
                                                <option value="">Selecciona...</option>
                                                <option value="Fuerza">Ganar fuerza</option>
                                                <option value="Hipertrofia">Ganar músculo</option>
                                                <option value="Resistencia">Mejorar resistencia</option>
                                                <option value="Perdida de peso">Perder peso</option>
                                                <option value="Bienestar">Bienestar general</option>
                                            </select>
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <label class="form-label" for="nivel">Nivel de experiencia</label>
                                            <select id="nivel" class="form-select" th:field="*{nivel}">
                                                <option value="">Selecciona...</option>
                                                <option value="Principiante">Principiante</option>
                                                <option value="Intermedio">Intermedio</option>
                                                <option value="Avanzado">Avanzado</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="row g-3 mb-3">
                                        <div class="col-12 col-md-6">
                                            <label class="form-label" for="diasSemana">Días disponibles por semana</label>
                                            <select id="diasSemana" class="form-select" th:field="*{diasSemana}">
                                                <option value="">Selecciona...</option>
                                                <option value="2">2 días</option>
                                                <option value="3">3 días</option>
                                                <option value="4">4 días</option>
                                                <option value="5">5 días</option>
                                                <option value="6">6 días</option>
                                            </select>
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <label class="form-label" for="minutosSesion">Tiempo disponible por sesión</label>
                                            <select id="minutosSesion" class="form-select" th:field="*{minutosSesion}">
                                                <option value="">Selecciona...</option>
                                                <option value="30">30 minutos</option>
                                                <option value="45">45 minutos</option>
                                                <option value="60">60 minutos</option>
                                                <option value="75">75 minutos</option>
                                                <option value="90">90 minutos</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label" for="equipamiento">Equipamiento disponible</label>
                                        <select id="equipamiento" class="form-select" th:field="*{equipamiento}">
                                            <option value="">Selecciona...</option>
                                            <option value="Gimnasio">Gimnasio completo</option>
                                            <option value="Casa">En casa (mancuernas/bandas)</option>
                                            <option value="Al aire libre">Al aire libre</option>
                                            <option value="Sin equipamiento">Sin equipamiento</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="form-label" for="lesiones">Lesiones o limitaciones físicas</label>
                                        <textarea id="lesiones"
                                                  class="form-control"
                                                  th:field="*{lesiones}"
                                                  rows="2"
                                                  placeholder="Ej: dolor de rodilla, lumbalgia... (opcional)"></textarea>
                                    </div>
                                </fieldset>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">
                                        Crear cuenta
                                    </button>
                                </div>
                            </form>
                            <p class="text-center text-body-secondary small mt-4 mb-0">
                                ¿Ya tienes cuenta?
                                <a th:href="@{/login}">Iniciar sesión</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    <th:block th:replace="~{general/fragmentos :: scripts}"></th:block>
</body>
</html>
