<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head('Crear cuenta')}"></head>

<body>

<div class="auth-page">

    <div class="auth-card auth-card--wide">

        <div class="auth-brand">
            <span class="sidebar__logo">GP</span>
            <strong>GymProgress</strong>
        </div>

        <h1 class="auth-title">Crear cuenta</h1>
        <p class="auth-subtitle">Cuéntanos un poco para personalizar tu experiencia.</p>

        <!-- HU4 — Mensajes de feedback -->
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert-success" th:text="${mensaje}"></div>

        <!-- HU4 — Encuesta de onboarding al registrarse -->
        <form method="post" th:action="@{/registro}" th:object="${usuario}" class="auth-form">

            <!-- Datos básicos de cuenta -->
            <fieldset class="form-fieldset">
                <legend>Datos de cuenta</legend>

                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input id="nombre" type="text" th:field="*{nombre}"
                           required placeholder="Tu nombre">
                </div>

                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input id="correo" type="email" th:field="*{correo}"
                           required placeholder="tu@correo.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input id="password" type="password" th:field="*{password}"
                           required placeholder="Mínimo 8 caracteres" autocomplete="new-password">
                </div>
            </fieldset>

            <!-- HU4 — Encuesta: objetivo, nivel, días, equipamiento, lesiones -->
            <fieldset class="form-fieldset">
                <legend>Tu perfil de entrenamiento</legend>

                <div class="form-row">
                    <div class="form-group">
                        <label for="objetivo">Objetivo principal</label>
                        <select id="objetivo" th:field="*{objetivo}">
                            <option value="">Selecciona...</option>
                            <option value="Fuerza">Ganar fuerza</option>
                            <option value="Hipertrofia">Ganar músculo</option>
                            <option value="Resistencia">Mejorar resistencia</option>
                            <option value="Perdida de peso">Perder peso</option>
                            <option value="Bienestar">Bienestar general</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="nivel">Nivel de experiencia</label>
                        <select id="nivel" th:field="*{nivel}">
                            <option value="">Selecciona...</option>
                            <option value="Principiante">Principiante</option>
                            <option value="Intermedio">Intermedio</option>
                            <option value="Avanzado">Avanzado</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="diasSemana">Días disponibles por semana</label>
                        <select id="diasSemana" th:field="*{diasSemana}">
                            <option value="">Selecciona...</option>
                            <option value="2">2 días</option>
                            <option value="3">3 días</option>
                            <option value="4">4 días</option>
                            <option value="5">5 días</option>
                            <option value="6">6 días</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="minutosSesion">Tiempo disponible por sesión</label>
                        <select id="minutosSesion" th:field="*{minutosSesion}">
                            <option value="">Selecciona...</option>
                            <option value="30">30 minutos</option>
                            <option value="45">45 minutos</option>
                            <option value="60">60 minutos</option>
                            <option value="75">75 minutos</option>
                            <option value="90">90 minutos</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="equipamiento">Equipamiento disponible</label>
                    <select id="equipamiento" th:field="*{equipamiento}">
                        <option value="">Selecciona...</option>
                        <option value="Gimnasio">Gimnasio completo</option>
                        <option value="Casa">En casa (mancuernas/bandas)</option>
                        <option value="Al aire libre">Al aire libre</option>
                        <option value="Sin equipamiento">Sin equipamiento</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="lesiones">Lesiones o limitaciones físicas</label>
                    <textarea id="lesiones"
                              th:field="*{lesiones}"
                              rows="2"
                              placeholder="Ej: dolor de rodilla, lumbalgia... (opcional)"></textarea>
                </div>
            </fieldset>

            <button type="submit" class="button-primary auth-submit">
                Crear cuenta
            </button>

        </form>

        <p class="auth-footer">
            ¿Ya tienes cuenta?
            <a th:href="@{/login}">Iniciar sesión</a>
        </p>

    </div>

</div>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
