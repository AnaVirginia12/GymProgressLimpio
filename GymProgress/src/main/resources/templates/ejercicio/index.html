<!DOCTYPE html>
<html lang="es"
      data-bs-theme="dark"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head('Ejercicios')}"></head>
    <body>
        <div class="d-flex min-vh-100">
            <aside th:replace="~{general/fragmentos :: sidebar('ejercicios')}"></aside>
            <div class="app-content flex-grow-1">
                <header th:replace="~{general/fragmentos :: mobileHeader}"></header>
                <main class="container-xxl p-4">
                    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
                        <div>
                            <h1 class="display-6 fw-bold mb-2">Ejercicios</h1>
                            <p class="text-body-secondary mb-0">
                                Consulta, busca y administra el catálogo de ejercicios.
                            </p>
                        </div>
                        <a class="btn btn-primary text-nowrap" th:href="@{/ejercicios/nuevo}">
                            Nuevo ejercicio
                        </a>
                    </div>
                    <div class="alert alert-success" role="alert"
                         th:if="${mensaje}" th:text="${mensaje}"></div>
                    <form class="row g-2 mb-4" method="get" th:action="@{/ejercicios}">
                        <div class="col-12 col-md">
                            <input type="text"
                                   class="form-control"
                                   name="q"
                                   placeholder="Buscar por nombre o grupo muscular..."
                                   th:value="${q}">
                        </div>
                        <div class="col-12 col-md-auto">
                            <select class="form-select" name="tipo">
                                <option value="" th:selected="${tipoSeleccionado == null}">Todos los tipos</option>
                                <option th:each="t : ${tipos}"
                                        th:value="${t}"
                                        th:text="${t}"
                                        th:selected="${t == tipoSeleccionado}">
                                </option>
                            </select>
                        </div>
                        <div class="col-12 col-md-auto d-grid">
                            <button type="submit" class="btn btn-secondary">Buscar</button>
                        </div>
                    </form>
                    <section class="card border-dashed text-center p-4"
                             th:if="${#lists.isEmpty(ejercicios)}">
                        <div class="card-body">
                            <h2 class="h4">No se encontraron ejercicios</h2>
                            <p class="text-body-secondary mb-0">
                                Probá con otro nombre, grupo muscular o tipo de entrenamiento.
                            </p>
                        </div>
                    </section>
                    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4"
                         th:unless="${#lists.isEmpty(ejercicios)}">
                        <div class="col" th:each="ejercicio : ${ejercicios}">
                            <article class="card h-100 overflow-hidden">
                                <div class="ratio ratio-16x9 bg-body">
                                    <img th:if="${ejercicio.mediaUrl != null and !ejercicio.mediaUrl.isBlank()}"
                                         th:src="${ejercicio.mediaUrl}"
                                         alt="Demostración del ejercicio"
                                         class="object-fit-cover">
                                    <div th:unless="${ejercicio.mediaUrl != null and !ejercicio.mediaUrl.isBlank()}"
                                         class="d-flex align-items-center justify-content-center text-body-secondary small">
                                        Sin imagen
                                    </div>
                                </div>
                                <div class="card-body d-flex flex-column gap-2">
                                    <div class="d-flex justify-content-between align-items-center gap-2">
                                        <h2 class="h5 mb-0" th:text="${ejercicio.nombre}">Nombre del ejercicio</h2>
                                        <form method="post"
                                              th:action="@{/ejercicios/{id}/favorito(id=${ejercicio.id})}">
                                            <button type="submit"
                                                    class="btn btn-link p-0 fs-4 lh-1 text-decoration-none"
                                                    th:classappend="${ejercicio.favorito ? 'text-warning' : 'text-body-secondary'}"
                                                    th:text="${ejercicio.favorito ? '★' : '☆'}">
                                            </button>
                                        </form>
                                    </div>
                                    <div class="d-flex flex-wrap gap-1">
                                        <span class="badge rounded-pill text-uppercase bg-primary-subtle text-primary-emphasis"
                                              th:text="${ejercicio.tipoEntrenamiento}">Gimnasio</span>
                                        <span class="badge rounded-pill text-uppercase bg-primary-subtle text-primary-emphasis"
                                              th:each="g : ${#strings.arraySplit(ejercicio.grupoMuscular, ',')}"
                                              th:text="${#strings.trim(g)}">
                                            Pecho
                                        </span>
                                    </div>
                                    <p class="text-body-secondary mb-0"
                                       th:text="${ejercicio.descripcion}">Descripción del ejercicio.</p>
                                    <div class="d-flex gap-2 mt-auto pt-2">
                                        <a class="btn btn-secondary btn-sm"
                                           th:href="@{/ejercicios/{id}/editar(id=${ejercicio.id})}">
                                            Editar
                                        </a>
                                        <form method="post"
                                              th:action="@{/ejercicios/{id}/eliminar(id=${ejercicio.id})}"
                                              onsubmit="return confirm('¿Eliminar este ejercicio?');">
                                            <button type="submit" class="btn btn-secondary btn-sm">Eliminar</button>
                                        </form>
                                    </div>
                                </div>
                            </article>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    <th:block th:replace="~{general/fragmentos :: scripts}"></th:block>
</body>
</html>
