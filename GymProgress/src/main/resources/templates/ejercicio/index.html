<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      data-bs-theme="dark">
    <head th:replace="~{general/fragmentos :: head('Ejercicios')}"></head>
    
    <body>
        <div class="d-flex">
            <aside th:replace="~{general/fragmentos :: sidebar('ejercicios')}"></aside>
            <div class="app-content">
                <header th:replace="~{general/fragmentos :: mobileHeader}"></header>
                <main class="container-xxl p-4">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                        <div>
                            <h1 class="mb-0">Ejercicios</h1>
                            <p class="text-secondary mt-2">
                                Consulta, busca y administra el catálogo de ejercicios.
                            </p>
                        </div>
                        <a class="btn btn-primary" th:href="@{/ejercicios/nuevo}">
                            Nuevo ejercicio
                        </a>
                    </div>
                    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
                    <form class="row row-cols-lg-auto g-2 align-items-center mb-4" method="get" th:action="@{/ejercicios}">
                        <div class="col-12 col-lg">
                            <input type="text"
                                   class="form-control"
                                   name="q"
                                   placeholder="Buscar por nombre o grupo muscular..."
                                   th:value="${q}">
                        </div>
                        <div class="col-12 col-lg">
                            <select name="tipo" class="form-select">
                                <option value="" th:selected="${tipoSeleccionado == null}">Todos los tipos</option>
                                <option th:each="t : ${tipos}"
                                        th:value="${t}"
                                        th:text="${t}"
                                        th:selected="${t == tipoSeleccionado}">
                                </option>
                            </select>
                        </div>
                        <div class="col-12 col-lg">
                            <button type="submit" class="btn btn-outline-secondary">Buscar</button>
                        </div>
                    </form>
                    <section class="card border-dashed text-center p-5" th:if="${#lists.isEmpty(ejercicios)}">
                        <h2>No se encontraron ejercicios</h2>
                        <p class="text-secondary mb-0">Probá con otro nombre, grupo muscular o tipo de entrenamiento.</p>
                    </section>
                    <section class="row row-cols-1 row-cols-md-3 g-4" th:unless="${#lists.isEmpty(ejercicios)}">
                        <article class="col" th:each="ejercicio : ${ejercicios}">
                            <div class="card h-100">
                                <img th:if="${ejercicio.mediaUrl != null and !ejercicio.mediaUrl.isBlank()}"
                                     th:src="${ejercicio.mediaUrl}"
                                     alt="Demostración del ejercicio"
                                     class="card-img-top object-fit-cover"
                                     style="height: 160px;">
                                <div th:unless="${ejercicio.mediaUrl != null and !ejercicio.mediaUrl.isBlank()}"
                                     class="card-img-top d-flex align-items-center justify-content-center bg-body-tertiary text-secondary"
                                     style="height: 160px;">
                                    Sin imagen
                                </div>
                                <div class="card-body d-flex flex-column gap-2">
                                    <div class="d-flex justify-content-between align-items-center gap-2">
                                        <h2 class="h5 mb-0" th:text="${ejercicio.nombre}">Nombre del ejercicio</h2>
                                        <form method="post" th:action="@{/ejercicios/{id}/favorito(id=${ejercicio.id})}">
                                            <button type="submit"
                                                    class="btn btn-link p-0 fs-4 text-decoration-none text-secondary"
                                                    th:classappend="${ejercicio.favorito ? 'text-warning' : ''}"
                                                    th:text="${ejercicio.favorito ? '★' : '☆'}">
                                            </button>
                                        </form>
                                    </div>
                                    <div class="d-flex flex-wrap gap-1">
                                        <span class="badge text-bg-primary-subtle rounded-pill" th:text="${ejercicio.tipoEntrenamiento}">Gimnasio</span>
                                        <span class="badge text-bg-primary-subtle rounded-pill"
                                              th:each="g : ${#strings.arraySplit(ejercicio.grupoMuscular, ',')}"
                                              th:text="${#strings.trim(g)}">
                                            Pecho
                                        </span>
                                    </div>
                                    <p class="text-secondary mb-0" th:text="${ejercicio.descripcion}">Descripción del ejercicio.</p>
                                    <div class="d-flex gap-2 mt-2">
                                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/ejercicios/{id}/editar(id=${ejercicio.id})}">
                                            Editar
                                        </a>
                                        <form method="post"
                                              th:action="@{/ejercicios/{id}/eliminar(id=${ejercicio.id})}"
                                              onsubmit="return confirm('¿Eliminar este ejercicio?');">
                                            <button type="submit" class="btn btn-outline-secondary btn-sm">Eliminar</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </article>
                    </section>
                </main>
            </div>
        </div>
        <script th:src="@{/js/app.js}"></script>
    </body>
</html>
