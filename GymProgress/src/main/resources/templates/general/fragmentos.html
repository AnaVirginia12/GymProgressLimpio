<!DOCTYPE html>
<html lang="es"
      data-bs-theme="dark"
      xmlns:th="http://www.thymeleaf.org">
    <head th:fragment="head(titulo)">
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
        <title th:text="${titulo + ' | GymProgress'}">
            GymProgress
        </title>
        <!-- Aplica el tema guardado antes de pintar, para evitar parpadeo -->
        <script>
            (function () {
                var tema = localStorage.getItem('gp-theme');
                if (tema === 'dark' || tema === 'light') {
                    document.documentElement.setAttribute('data-bs-theme', tema);
                }
            })();
        </script>
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet"
              th:href="@{/css/app.css}">
    </head>
    <body>
        <a th:fragment="marca"
           class="d-flex align-items-center gap-2 mb-4 text-decoration-none text-body"
           th:href="@{/}">
            <img class="avatar rounded-3 object-fit-cover"
                 th:src="@{/img/logo.png}"
                 alt="GymProgress">
            <span class="fs-5 fw-bold">GymProgress</span>
        </a>

        <aside th:fragment="sidebar(seccionActiva)"
               class="sidebar d-flex flex-column p-3 border-end"
               id="sidebar">
            <div th:replace="~{general/fragmentos :: marca}" class="mb-4"></div>
            <ul class="nav nav-pills flex-column gap-1">
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/}"
                       th:classappend="${seccionActiva == 'inicio' ? 'active' : ''}">
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/rutinas/hoy}"
                       th:classappend="${seccionActiva == 'rutina-hoy' ? 'active' : ''}">
                        Rutina de hoy
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/historial}"
                       th:classappend="${seccionActiva == 'historial' ? 'active' : ''}">
                        Historial
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/ejercicios}"
                       th:classappend="${seccionActiva == 'ejercicios' ? 'active' : ''}">
                        Ejercicios
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/rutinas}"
                       th:classappend="${seccionActiva == 'rutinas' ? 'active' : ''}">
                        Rutinas
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/progreso}"
                       th:classappend="${seccionActiva == 'progreso' ? 'active' : ''}">
                        Progreso
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/peso}"
                       th:classappend="${seccionActiva == 'peso' ? 'active' : ''}">
                        Registrar peso
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/perfil}"
                       th:classappend="${seccionActiva == 'perfil' ? 'active' : ''}">
                        Perfil
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/configuracion}"
                       th:classappend="${seccionActiva == 'configuracion' ? 'active' : ''}">
                        Configuración
                    </a>
                </li>
            </ul>
            <a class="d-flex align-items-center gap-2 mt-auto pt-3 border-top text-decoration-none text-body"
               th:href="@{/perfil}">

                <img th:if="${usuarioActual != null and !#strings.isEmpty(usuarioActual.fotoUrl)}"
                     class="avatar rounded-circle object-fit-cover"
                     th:src="${usuarioActual.fotoUrl}"
                     th:alt="${usuarioActual.nombre}">

                <span th:unless="${usuarioActual != null and !#strings.isEmpty(usuarioActual.fotoUrl)}"
                      class="avatar rounded-circle bg-primary text-white fw-bold"
                      th:text="${usuarioActual != null and !#strings.isEmpty(usuarioActual.nombre)}
                               ? ${#strings.toUpperCase(#strings.substring(usuarioActual.nombre, 0, 1))}
                               : 'U'">U</span>

                <div class="overflow-hidden">
                    <strong class="d-block text-truncate"
                            th:text="${usuarioActual != null} ? ${usuarioActual.nombre} : 'Usuario'">Usuario</strong>
                    <small class="d-block text-body-secondary">Ver perfil</small>
                </div>
            </a>
        </aside>
        <!--
            Slider de modo oscuro/claro, arriba a la derecha.
            Fragmento reutilizable: se inserta tanto en la barra móvil
            como flotante en escritorio (ver mobileHeader más abajo).
        -->
        <div th:fragment="themeSwitch"
             class="form-check form-switch theme-switch d-flex align-items-center gap-2 mb-0">
            <span aria-hidden="true">🌙</span>
            <input class="form-check-input tema-switch-input"
                   type="checkbox"
                   role="switch"
                   aria-label="Cambiar entre modo oscuro y modo claro"
                   title="Cambiar tema">
            <span aria-hidden="true">☀️</span>
        </div>
        <th:block th:fragment="mobileHeader">
            <header class="d-flex d-lg-none align-items-center gap-3 px-3 py-2 border-bottom bg-body-tertiary">
                <button type="button"
                        class="btn btn-secondary btn-sm"
                        id="sidebarToggle"
                        aria-label="Abrir menú">
                    ☰
                </button>
                <a class="d-flex align-items-center gap-2 text-decoration-none text-body"
                   th:href="@{/}">
                    <img th:src="@{/img/logo.png}" alt="GymProgress"
                         class="rounded-3 object-fit-cover" width="28" height="28">
                    <strong>GymProgress</strong>
                </a>
                <div class="ms-auto">
                    <div th:replace="~{general/fragmentos :: themeSwitch}"></div>
                </div>
            </header>
            <div class="theme-toggle-desktop d-none d-lg-flex position-fixed top-0 end-0 p-3">
                <div th:replace="~{general/fragmentos :: themeSwitch}"></div>
            </div>
        </th:block>
    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/app.js}"></script>
        <!-- HU2 — Modo sin conexión: aviso visual y cola de series -->
        <script th:src="@{/js/offline.js}"></script>
    </th:block>
</body>
</html>
