<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      data-bs-theme="dark">
    <head th:fragment="head(titulo)">
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
        <title th:text="${titulo + ' | GymProgress'}">
            GymProgress
        </title>
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet"
              th:href="@{/css/app.css}">
    </head>
    
    <body class="bg-dark text-light">
        <aside th:fragment="sidebar(seccionActiva)"
               class="sidebar d-flex flex-column p-3 bg-body-tertiary border-end"
               id="sidebar">
            <div class="d-flex align-items-center gap-2 mb-4 fs-5 fw-bold">
                <span class="d-flex align-items-center justify-content-center rounded-3 bg-primary text-white fw-bold"
                      style="width: 36px; height: 36px;">
                    GP
                </span>
                <span>GymProgress</span>
            </div>
            <nav class="nav nav-pills flex-column gap-1">
                <a class="nav-link text-light"
                   th:href="@{/}"
                   th:classappend="${seccionActiva == 'inicio' ? 'active' : ''}">
                    Dashboard
                </a>
                <a class="nav-link text-light"
                   th:href="@{/rutinas/hoy}"
                   th:classappend="${seccionActiva == 'rutina-hoy' ? 'active' : ''}">
                    Rutina de hoy
                </a>
                <a class="nav-link text-light"
                   th:href="@{/historial}"
                   th:classappend="${seccionActiva == 'historial' ? 'active' : ''}">
                    Historial
                </a>
                <a class="nav-link text-light"
                   th:href="@{/ejercicios}"
                   th:classappend="${seccionActiva == 'ejercicios' ? 'active' : ''}">
                    Ejercicios
                </a>
                <a class="nav-link text-light"
                   th:href="@{/rutinas}"
                   th:classappend="${seccionActiva == 'rutinas' ? 'active' : ''}">
                    Rutinas
                </a>
                <a class="nav-link text-light"
                   th:href="@{/progreso}"
                   th:classappend="${seccionActiva == 'progreso' ? 'active' : ''}">
                    Progreso
                </a>
                <a class="nav-link text-light"
                   th:href="@{/perfil}"
                   th:classappend="${seccionActiva == 'perfil' ? 'active' : ''}">
                    Perfil
                </a>
                <a class="nav-link text-light"
                   th:href="@{/configuracion}"
                   th:classappend="${seccionActiva == 'configuracion' ? 'active' : ''}">
                    Configuración
                </a>
            </nav>
            <div class="d-flex align-items-center gap-2 mt-auto pt-3 border-top border-secondary-subtle">
                <div class="d-flex align-items-center justify-content-center rounded-3 bg-primary text-white fw-bold"
                     style="width: 36px; height: 36px;">
                    U
                </div>
                <div>
                    <strong class="d-block">Usuario</strong>
                    <small class="d-block text-secondary">Ver perfil</small>
                </div>
            </div>
        </aside>
        <header th:fragment="mobileHeader"
                class="mobile-header d-flex align-items-center gap-3 p-3 border-bottom bg-body-tertiary">
            <button type="button"
                    id="sidebarToggle"
                    class="btn btn-outline-light btn-sm"
                    aria-label="Abrir menú">
                ☰
            </button>
            <strong>GymProgress</strong>
        </header>
    </body>
</html>
