<!DOCTYPE html>
<html lang="es"
      data-bs-theme="dark"
      xmlns:th="http://www.thymeleaf.org">
    <head th:fragment="head(titulo)">
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
        <title th:text="${titulo + ' | GymProgress'}">
            GymProgress
        </title>
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet"
              th:href="@{/css/app.css}">
    </head>
    <body>
        <aside th:fragment="sidebar(seccionActiva)"
               class="sidebar d-flex flex-column p-3 border-end"
               id="sidebar">
            <div class="d-flex align-items-center gap-2 mb-4">
                <span class="avatar rounded-3 bg-primary text-white fw-bold">GP</span>
                <span class="fs-5 fw-bold">GymProgress</span>
            </div>
            <ul class="nav nav-pills flex-column gap-1">
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/}"
                       th:classappend="${seccionActiva == 'inicio' ? 'active' : ''}">
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/rutinas/hoy}"
                       th:classappend="${seccionActiva == 'rutina-hoy' ? 'active' : ''}">
                        Rutina de hoy
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/historial}"
                       th:classappend="${seccionActiva == 'historial' ? 'active' : ''}">
                        Historial
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/ejercicios}"
                       th:classappend="${seccionActiva == 'ejercicios' ? 'active' : ''}">
                        Ejercicios
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/rutinas}"
                       th:classappend="${seccionActiva == 'rutinas' ? 'active' : ''}">
                        Rutinas
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/progreso}"
                       th:classappend="${seccionActiva == 'progreso' ? 'active' : ''}">
                        Progreso
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/peso}"
                       th:classappend="${seccionActiva == 'peso' ? 'active' : ''}">
                        Registrar peso
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/perfil}"
                       th:classappend="${seccionActiva == 'perfil' ? 'active' : ''}">
                        Perfil
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/configuracion}"
                       th:classappend="${seccionActiva == 'configuracion' ? 'active' : ''}">
                        Configuración
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2 mt-auto pt-3 border-top">

                <span class="avatar rounded-circle bg-primary text-white fw-bold">
                    U
                </span>
                <div>
                    <strong class="d-block">Usuario</strong>
                    <small class="d-block text-body-secondary">Ver perfil</small>
                </div>
            </div>
        </aside>
        <header th:fragment="mobileHeader"
                class="d-flex d-lg-none align-items-center gap-3 px-3 py-2 border-bottom bg-body-tertiary">
            <button type="button"
                    class="btn btn-secondary btn-sm"
                    id="sidebarToggle"
                    aria-label="Abrir menú">
                ☰
            </button>
            <strong>GymProgress</strong>
        </header>
    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/app.js}"></script>
        <!-- HU2 — Modo sin conexión: aviso visual y cola de series -->
        <script th:src="@{/js/offline.js}"></script>
    </th:block>
</body>
</html>
